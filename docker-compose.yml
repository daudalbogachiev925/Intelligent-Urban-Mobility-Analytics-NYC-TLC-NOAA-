version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - CONFIG_PATH=/app/configs/config.yaml
      - DATA_DIR=/app/data
      - ARTIFACTS_DIR=/app/artifacts
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3
